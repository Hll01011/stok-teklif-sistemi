<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Şifre Yenile</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><section class="login-view"><div class="login-card"><div class="brand-mark">ST</div><span class="eyebrow">HIS • HESAP</span><h1>Yeni şifreni belirle.</h1><p>Yeni şifren en az 8 karakter olsun.</p><form id="f"><label>Yeni şifre<input id="p1" type="password" minlength="8" required></label><label>Yeni şifre tekrar<input id="p2" type="password" minlength="8" required></label><button class="primary full">Şifreyi güncelle</button></form><small id="m"></small></div></section><script src="js/supabase.js"></script><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const a=p1.value,b=p2.value;if(a!==b)return m.textContent='Şifreler aynı değil.';const{error}=await sb.auth.updateUser({password:a});if(error)return m.textContent=error.message;m.textContent='Şifre güncellendi. Giriş sayfasına yönlendiriliyorsunuz.';setTimeout(()=>location.href='./',1500)}</script></body></html>
